services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: sqlite:////data/dosedeck.db
      AI_MODE: mock
      DEMO_MODE: "true"
      PRESENTATION_MODE: "true"
    volumes:
      - dosedeck_data:/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  dosedeck_data:
